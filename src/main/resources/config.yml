# =========================================================
#  Random Events Engine - Default Configuration
# =========================================================
# - The engine runs one random event from the active preset every X seconds.
# - You can define multiple presets with different timings, difficulty, and settings.
# - Use: /re start <presetName> to start, /re stop to stop, /re list to see presets.
# =========================================================

version: 1

# Which preset to start when the plugin first enables
default-preset: "chaos-60s"

presets:
  # =======================================================
  # CHAOS MODE — fast-paced, chaotic, and challenging
  # Runs every 60 seconds
  # =======================================================
  chaos-60s:
    frequency-seconds: 60
    bossbar:
      enabled: true
      color: RED
      style: SOLID
      showPreset: true

    # Controls how often each event is chosen (higher = more frequent)
    weights:
      hotbar_shuffle: 2
      item_rain: 3
      mob_ambush: 2
      floor_is_lava: 2
      potion_roulette: 1

    per-event:
      hotbar_shuffle:
        restoreSeconds: 10

      item_rain:
        height: 14
        count: 40
        despawnSeconds: 30
        items:
          # Food & useful
          - "minecraft:apple:1..2"
          - "minecraft:bread:1..3"
          - "minecraft:golden_carrot:1..2"
          - "minecraft:cooked_beef:1..2"
          # Ammo & blocks
          - "minecraft:arrow:4..16"
          - "minecraft:stone:16..32"
          - "minecraft:cobblestone:16..32"
          - "minecraft:oak_log:4..8"
          # Rare loot (lower stack sizes)
          - "minecraft:iron_ingot:1..3"
          - "minecraft:gold_ingot:1..3"
          - "minecraft:ender_pearl:1..2"
          - "minecraft:slime_ball:1..2"
          # Silly/chaos
          - "minecraft:tnt:1..2"
          - "minecraft:fire_charge:1..2"
          - "minecraft:anvil:1"

      mob_ambush:
        count: 5
        capPerPlayer: 8
        radius: 6
        yOffset: 0
        despawnSeconds: 30
        aggro: true
        types: [ ZOMBIE, SKELETON ]
        gear:
          helmet: IRON_HELMET
          chestplate: LEATHER_CHESTPLATE
          mainHand: STONE_SWORD

      floor_is_lava:
        radius: 5
        durationSeconds: 10
        block: MAGMA_BLOCK
        revert: true
        perPlayer: true

      potion_roulette:
        durationSeconds: 20
        amplifier: 0
        goodWeight: 2
        good: [ SPEED, HASTE, JUMP_BOOST, NIGHT_VISION, REGENERATION ]
        bad:  [ SLOWNESS, MINING_FATIGUE, BLINDNESS, LEVITATION, WEAKNESS ]


  # =======================================================
  # CHILL MODE — slower pace, easier effects
  # Runs every 120 seconds
  # =======================================================
  chill-120s:
    frequency-seconds: 120
    bossbar:
      enabled: true
      color: BLUE
      style: SEGMENTED_10
      showPreset: true

    weights:
      hotbar_shuffle: 2
      item_rain: 3
      potion_roulette: 1

    per-event:
      hotbar_shuffle:
        restoreSeconds: 10

      item_rain:
        height: 10
        count: 16
        despawnSeconds: 60
        items:
          # Food
          - "minecraft:apple:1..3"
          - "minecraft:bread:1..3"
          - "minecraft:cookie:2..6"
          # Basic blocks
          - "minecraft:oak_planks:4..12"
          - "minecraft:cobblestone:8..16"
          - "minecraft:coal:1..3"
          # Light rewards
          - "minecraft:iron_ingot:1..2"
          - "minecraft:feather:2..5"
          - "minecraft:book:1..2"

      potion_roulette:
        durationSeconds: 15
        amplifier: 0
        goodWeight: 5
        good: [ SPEED, HASTE, JUMP_BOOST, NIGHT_VISION, REGENERATION ]
        bad:  [ SLOWNESS ]